name: Validate public skill

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate skill package layout
        shell: bash
        run: |
          test ! -f SKILL.md
          test -f skills/youtube-notes/SKILL.md
          test -f skills/youtube-notes/agents/openai.yaml
          test -x skills/youtube-notes/scripts/fetch-captions
          bash -n skills/youtube-notes/scripts/fetch-captions
          grep -q '^name: youtube-notes$' skills/youtube-notes/SKILL.md
          grep -q '\$youtube-notes' skills/youtube-notes/agents/openai.yaml

      - name: Compile and unit-test the caption parser
        shell: bash
        run: |
          cargo test --manifest-path rust/Cargo.toml --all-targets
          ./skills/youtube-notes/scripts/fetch-captions --help > /dev/null
