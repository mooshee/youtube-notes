# Author: Daniel Hallman
[package]
name = "fetch-captions"
version = "0.1.0"
edition = "2024"
authors = ["Daniel Hallman"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
html-escape = "0.2"
quick-xml = "0.37"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
